services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fastbot
      POSTGRES_PASSWORD: fastbot
      POSTGRES_DB: fastbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastbot -d fastbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fastbot:fastbot@db:5432/fastbot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.19.0/24

volumes:
  pgdata:
